[theme]
base = "dark"
primaryColor = "#C6F56B"
backgroundColor = "#0B0F1A"
secondaryBackgroundColor = "#141A2B"
textColor = "#EEF1F8"
linkColor = "#C6F56B"
borderColor = "#27304A"
dataframeBorderColor = "#27304A"
dataframeHeaderBackgroundColor = "#141A2B"
baseRadius = "10px"
buttonRadius = "999px"
font = "Inter, -apple-system, 'Segoe UI', sans-serif"
headingFont = "Inter, -apple-system, 'Segoe UI', sans-serif"
chartCategoricalColors = ["#9FB1FF", "#B9A3FF", "#5FD4A6", "#FF7A7A", "#9AA6C4", "#C6F56B"]

[theme.sidebar]
backgroundColor = "#070A12"
secondaryBackgroundColor = "#121828"
textColor = "#E6E9F5"
borderColor = "#1C2338"
dataframeHeaderBackgroundColor = "#121828"

[server]
headless = true
maxUploadSize = 25
runOnSave = false

[browser]
gatherUsageStats = false
